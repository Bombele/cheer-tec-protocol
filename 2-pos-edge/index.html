<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexwallet.app — Point Zero POS & P&L Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function LexWalletAdvancedPOS() {
            const [catalog, setCatalog] = React.useState(null);
            const [cart, setCart] = React.useState([]);
            const [transactions, setTransactions] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [processing, setProcessing] = React.useState(false);
            const [discountCode, setDiscountCode] = React.useState("");
            const [discountPercent, setDiscountPercent] = React.useState(0);
            
            // Filtres & Admin Holding
            const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [adminPin, setAdminPin] = React.useState("");
            const [showAdminModal, setShowAdminModal] = React.useState(false);
            const [showZModal, setShowZModal] = React.useState(false);
            const [zReportData, setZReportData] = React.useState(null);

            React.useEffect(() => {
                const enterpriseCatalog = {
                    "categories": [
                        {
                            "category_id": "CAT-01",
                            "name": "Burgers Signature",
                            "items": [
                                { "sku": "CHEER-BURGER-01", "name": "Cheer Classic Cheese Burger", "price_ht": 9.50, "unit_cogs": 2.85, "description": "Bœuf charolais, cheddar affiné" },
                                { "sku": "CHEER-BURGER-02", "name": "Cheer Truffle Bacon Burger", "price_ht": 12.50, "unit_cogs": 3.75, "description": "Bœuf, double cheddar, truffe" }
                            ]
                        },
                        {
                            "category_id": "CAT-02",
                            "name": "Street Food & Salchipapa",
                            "items": [
                                { "sku": "CHEER-SALCH-01", "name": "Salchipapa Premium Cheer", "price_ht": 10.00, "unit_cogs": 3.00, "description": "Frites, saucisses artisanales" },
                                { "sku": "CHEER-PEPITO-01", "name": "Pepito Traditionnel Vénézuélien", "price_ht": 11.50, "unit_cogs": 3.45, "description": "Baguette, bœuf, queso blanco" }
                            ]
                        },
                        {
                            "category_id": "CAT-03",
                            "name": "Boissons & Fromages",
                            "items": [
                                { "sku": "BEV-COLA-01", "name": "Boisson Artisanale / Limonade", "price_ht": 3.50, "unit_cogs": 1.00, "description": "33cl" },
                                { "sku": "CHEESE-PLATE-01", "name": "Plateau de Fromages Affinés", "price_ht": 14.00, "unit_cogs": 4.50, "description": "Sélection du terroir" }
                            ]
                        }
                    ],
                    "tax_rate_standard": 0.20
                };
                setCatalog(enterpriseCatalog);
                setLoading(false);
            }, []);

            const addToCart = (item) => {
                setCart(prev => {
                    const existing = prev.find(i => i.sku === item.sku);
                    if (existing) {
                        return prev.map(i => i.sku === item.sku ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { ...item, qty: 1 }];
                });
            };

            const removeFromCart = (sku) => {
                setCart(prev => prev.filter(i => i.sku !== sku));
            };

            const applyCoupon = () => {
                if (discountCode.toUpperCase() === "CHEEZVIP") {
                    setDiscountPercent(10);
                    alert("Coupon VIP appliqué : -10%.");
                } else if (discountCode.toUpperCase() === "STAFF") {
                    setDiscountPercent(20);
                    alert("Coupon Staff appliqué : -20%.");
                } else {
                    alert("Code invalide.");
                    setDiscountPercent(0);
                }
            };

            const rawSubtotalHT = cart.reduce((acc, item) => acc + (item.price_ht * item.qty), 0);
            const discountAmountHT = rawSubtotalHT * (discountPercent / 100);
            const subtotalHT = rawSubtotalHT - discountAmountHT;
            const totalCOGS = cart.reduce((acc, item) => acc + (item.unit_cogs * item.qty), 0);
            const grossMargin = subtotalHT - totalCOGS;
            const vat = subtotalHT * 0.20;
            const totalTTC = subtotalHT + vat;

            const handleCheckout = async (isTest = false) => {
                if (cart.length === 0) return;
                setProcessing(true);

                const txId = `TX-${Date.now()}`;
                const orderPayload = {
                    id: txId,
                    terminalId: "LEX-POS-TERM-01",
                    timestamp: new Date().toISOString(),
                    date_key: selectedDate,
                    is_test: isTest,
                    items: [...cart],
                    subtotal_ht: Number(subtotalHT.toFixed(2)),
                    vat: Number(vat.toFixed(2)),
                    total_ttc: Number(totalTTC.toFixed(2)),
                    cogs_total: Number(totalCOGS.toFixed(2)),
                    gross_margin: Number(grossMargin.toFixed(2)),
                    payment_method: "Carte Bancaire"
                };

                try {
                    const response = await fetch('https://delegal.dev/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderPayload)
                    });

                    if (!response.ok) throw new Error("Erreur de transmission kernel");
                    const result = await response.json();
                    
                    setTransactions(prev => [result.financial_ledger || orderPayload, ...prev]);
                    alert(isTest ? "[TEST] Commande enregistrée hors CA." : `Encaissement validé !\nID : ${txId}\nTotal : ${totalTTC.toFixed(2)} €`);
                    setCart([]);
                    setDiscountPercent(0);
                    setDiscountCode("");
                } catch (err) {
                    setTransactions(prev => [orderPayload, ...prev]);
                    alert("Enregistrement local effectué (Mode résilient).");
                    setCart([]);
                } finally {
                    setProcessing(false);
                }
            };

            const handleZReport = () => {
                const filteredTxs = transactions.filter(tx => !tx.is_test && (!selectedDate || tx.date_key === selectedDate));
                const totalTTC = filteredTxs.reduce((acc, tx) => acc + tx.total_ttc, 0);
                const totalHT = filteredTxs.reduce((acc, tx) => acc + tx.subtotal_ht, 0);
                const totalVAT = filteredTxs.reduce((acc, tx) => acc + tx.vat, 0);

                setZReportData({
                    terminal_id: "LEX-POS-TERM-01",
                    z_sequence_number: 1045,
                    date: selectedDate,
                    grand_total_ttc: totalTTC,
                    total_ht: totalHT,
                    total_vat: totalVAT,
                    total_tickets: filteredTxs.length
                });
                setShowZModal(true);
            };

            const handleAdminPurge = async () => {
                if (adminPin !== "CHEEZ-ADMIN-2026") {
                    alert("Code PIN Administrateur Holding incorrect.");
                    return;
                }
                setTransactions(prev => prev.filter(tx => !tx.is_test));
                alert("Purge des tests effectuée avec succès.");
                setShowAdminModal(false);
                setAdminPin("");
            };

            const activeTxs = transactions.filter(tx => !tx.is_test && (!selectedDate || tx.date_key === selectedDate));
            const pnlCA = activeTxs.reduce((acc, tx) => acc + tx.total_ttc, 0);
            const pnlHT = activeTxs.reduce((acc, tx) => acc + (tx.subtotal_ht || 0), 0);
            const pnlCOGS = activeTxs.reduce((acc, tx) => acc + (tx.cogs_total || 0), 0);
            const pnlMargin = pnlHT - pnlCOGS;

            if (loading) return <div className="p-8 text-center text-sky-400 font-mono">Chargement du Point Zéro...</div>;

            return (
                <div className="min-h-screen bg-slate-950 text-white p-4 md:p-8 font-sans">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-slate-800 pb-4 gap-4">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-sky-400">Lexwallet.app — POS & P&L Engine</h1>
                            <p className="text-xs text-slate-400">Cheer Cheese Flagship • Contrôle Financier & Fisc</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <input 
                                type="date" 
                                value={selectedDate} 
                                onChange={(e) => setSelectedDate(e.target.value)}
                                className="bg-slate-900 border border-slate-800 text-xs px-3 py-2 rounded text-white font-mono"
                            />
                            <button onClick={handleZReport} className="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded text-xs font-bold transition">
                                Clôture Z
                            </button>
                            <button onClick={() => setShowAdminModal(true)} className="bg-rose-950 border border-rose-800 text-rose-300 px-3 py-2 rounded text-xs font-bold transition">
                                Admin Holding
                            </button>
                        </div>
                    </header>

                    {/* TABLEAU DE BORD P&L EN DIRECT */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">CA Total TTC ({selectedDate})</p>
                            <p className="text-lg font-bold text-sky-400 font-mono mt-1">{pnlCA.toFixed(2)} €</p>
                        </div>
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">CA Net HT</p>
                            <p className="text-lg font-bold text-slate-200 font-mono mt-1">{pnlHT.toFixed(2)} €</p>
                        </div>
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">COGS (Achats)</p>
                            <p className="text-lg font-bold text-amber-400 font-mono mt-1">-{pnlCOGS.toFixed(2)} €</p>
                        </div>
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">Marge Brute P&L</p>
                            <p className="text-lg font-bold text-emerald-400 font-mono mt-1">{pnlMargin.toFixed(2)} €</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Catalogue */}
                        <div className="lg:col-span-2 space-y-4">
                            {catalog.categories.map((cat) => (
                                <div key={cat.category_id} className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                    <h2 className="text-md font-semibold text-sky-300 mb-3">{cat.name}</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {cat.items.map((item) => (
                                            <div key={item.sku} className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col justify-between">
                                                <div>
                                                    <h3 className="font-bold text-slate-100 text-sm">{item.name}</h3>
                                                    <p className="text-[11px] text-slate-400">{item.description}</p>
                                                </div>
                                                <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-900 text-xs">
                                                    <span className="text-sky-400 font-mono font-bold">{item.price_ht.toFixed(2)} € HT</span>
                                                    <button onClick={() => addToCart(item)} className="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1 rounded font-semibold">
                                                        Ajouter
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Panier & Historique Réel */}
                        <div className="space-y-6">
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-xl">
                                <h2 className="text-md font-semibold text-sky-300 mb-3">Panier Actuel</h2>
                                {cart.length === 0 ? (
                                    <p className="text-slate-500 text-xs py-4 text-center">Panier vide.</p>
                                ) : (
                                    <div className="space-y-3 text-xs">
                                        <div className="divide-y divide-slate-800 max-h-36 overflow-y-auto">
                                            {cart.map(item => (
                                                <div key={item.sku} className="py-2 flex justify-between items-center">
                                                    <span>{item.name} (x{item.qty})</span>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-mono text-sky-300">{(item.price_ht * item.qty).toFixed(2)} €</span>
                                                        <button onClick={() => removeFromCart(item.sku)} className="text-rose-400 font-bold">✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 pt-2 border-t border-slate-800">
                                            <input type="text" placeholder="Code VIP" value={discountCode} onChange={(e) => setDiscountCode(e.target.value)} className="bg-slate-950 border border-slate-800 px-2 py-1.5 rounded uppercase font-mono w-full"/>
                                            <button onClick={applyCoupon} className="bg-slate-800 px-3 py-1.5 rounded text-sky-300">OK</button>
                                        </div>
                                        <div className="font-mono space-y-1 pt-2 border-t border-slate-800 text-[11px]">
                                            <div className="flex justify-between"><span>Total TTC:</span><span className="text-sky-400 font-bold">{totalTTC.toFixed(2)} €</span></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 pt-2">
                                            <button onClick={() => handleCheckout(false)} disabled={processing} className="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded font-bold">
                                                Valider Vente
                                            </button>
                                            <button onClick={() => handleCheckout(true)} disabled={processing} className="bg-amber-700 hover:bg-amber-600 text-white py-2.5 rounded font-bold">
                                                Mode Test
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* HISTORIQUE DES COMMANDES RÉELLES */}
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <h3 className="text-sm font-bold text-sky-300 mb-3">Historique des Commandes</h3>
                                <div className="space-y-2 max-h-48 overflow-y-auto text-xs font-mono">
                                    {transactions.length === 0 ? (
                                        <p className="text-slate-500 text-center py-2">Aucune commande enregistrée.</p>
                                    ) : (
                                        transactions.map((tx, idx) => (
                                            <div key={idx} className={`p-2 rounded border ${tx.is_test ? 'border-amber-900 bg-amber-950/20 text-amber-400' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                                                <div className="flex justify-between font-bold">
                                                    <span>{tx.id} {tx.is_test && '(TEST)'}</span>
                                                    <span>{tx.total_ttc?.toFixed(2)} €</span>
                                                </div>
                                                <p className="text-[10px] text-slate-500">{new Date(tx.timestamp).toLocaleTimeString()} • {tx.payment_method || 'CB'}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MODAL CLÔTURE Z */}
                    {showZModal && zReportData && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 font-mono text-xs">
                                <h3 className="font-bold text-amber-400">RAPPORT Z DE CLÔTURE FISCALE</h3>
                                <p>Date : {zReportData.date}</p>
                                <p>Séquence Z # : {zReportData.z_sequence_number}</p>
                                <p>Tickets valides : {zReportData.total_tickets}</p>
                                <p>CA TTC : {zReportData.grand_total_ttc.toFixed(2)} €</p>
                                <p>TVA Collectée : {zReportData.total_vat.toFixed(2)} €</p>
                                <button onClick={() => setShowZModal(false)} className="w-full bg-sky-600 py-2 rounded text-white font-bold">Fermer</button>
                            </div>
                        </div>
                    )}

                    {/* MODAL ADMIN HOLDING */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 font-mono text-xs">
                                <h3 className="font-bold text-rose-400">SÉCURITÉ ADMIN HOLDING</h3>
                                <p className="text-slate-400">Entrez le code PIN pour purger les tests :</p>
                                <input type="password" placeholder="PIN Master" value={adminPin} onChange={(e) => setAdminPin(e.target.value)} className="bg-slate-950 border border-slate-800 px-3 py-2 rounded w-full text-white"/>
                                <div className="flex gap-2">
                                    <button onClick={handleAdminPurge} className="bg-rose-600 hover:bg-rose-500 text-white py-2 rounded w-full font-bold">Confirmer Purge</button>
                                    <button onClick={() => setShowAdminModal(false)} className="bg-slate-800 py-2 rounded w-full">Annuler</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.render(<LexWalletAdvancedPOS />, document.getElementById('root'));
    </script>
</body>
</html>
